---
# Upgrades ONE already-joined node by one Kubernetes minor. The control plane
# and a worker differ only in the kubeadm sub-command and in which host runs
# kubectl, so both go through this one file — included once per play from
# playbooks/kubernetes-upgrade.yml (control plane first, then each worker).
#
# Expects:
#   upgrade_node_is_control_plane  bool  `kubeadm upgrade apply` vs `... node`
#   upgrade_node_kubectl_host      str   host holding admin.conf; drain,
#                                        uncordon and the Ready wait run there
#                                        (the node itself for the control
#                                        plane, the control plane for a worker)
#
# Also needs the "Restart kubelet" handler in the calling play, and the
# k8s_upgrade_cp_done fact from the preflight play.

- name: Identify this node from its kubelet certificate
  ansible.builtin.include_tasks: node-name-from-cert.yml

- name: Read this node's current kubelet version
  delegate_to: "{{ upgrade_node_kubectl_host }}"
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf get node {{ kubelet_cert_node_name }}
    --no-headers -o custom-columns=V:.status.nodeInfo.kubeletVersion
  register: _upgrade_node_kubelet_ver
  changed_when: false

# The single guard the whole upgrade hangs off: a node is touched only while
# its kubelet is still on an older minor. That makes every run resumable — a
# run that dies on one node re-runs and skips whatever already finished — and
# it is what stops a re-run from needlessly draining a node that is done.
- name: Decide whether this node still needs the upgrade
  ansible.builtin.set_fact:
    upgrade_node_needed: >-
      {{ (_upgrade_node_kubelet_ver.stdout | trim
          | regex_replace('^v([0-9]+)\.([0-9]+)\..*$', '\g<1>.\g<2>')) != kubernetes_series }}

- name: Report a node that is already done
  ansible.builtin.debug:
    msg: "{{ kubelet_cert_node_name }} is already on {{ _upgrade_node_kubelet_ver.stdout | trim }} — skipping."
  when: not (upgrade_node_needed | bool)

- name: "Upgrade {{ kubelet_cert_node_name }}"
  when: upgrade_node_needed | bool
  block:
    - name: Unhold kubeadm
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.dpkg_selections:
        name: kubeadm
        selection: install

    - name: Install the target kubeadm
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.apt:
        name: "kubeadm={{ kubernetes_package_version }}"
        state: present
        allow_downgrade: false
        update_cache: false

    - name: Hold kubeadm again
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.dpkg_selections:
        name: kubeadm
        selection: hold

    # Control plane, and only if the API server is not already on the target:
    # on a resumed run where `apply` succeeded before a later step failed,
    # re-running `kubeadm upgrade apply` with the same version errors out.
    - name: Show the kubeadm upgrade plan
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.command: kubeadm upgrade plan {{ kubernetes_version }}
      register: _upgrade_node_plan
      changed_when: false
      when:
        - upgrade_node_is_control_plane | bool
        - not (k8s_upgrade_cp_done | default(false) | bool)

    - name: Print the kubeadm upgrade plan
      ansible.builtin.debug:
        var: _upgrade_node_plan.stdout_lines
      when:
        - upgrade_node_is_control_plane | bool
        - not (k8s_upgrade_cp_done | default(false) | bool)

    # async: `apply` restarts the API server and etcd under itself and can run
    # for several minutes; a backgrounded job survives an SSH hiccup.
    - name: Run kubeadm upgrade apply {{ kubernetes_version }}
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.command: kubeadm upgrade apply -y {{ kubernetes_version }}
      async: 1200
      poll: 15
      changed_when: true
      when:
        - upgrade_node_is_control_plane | bool
        - not (k8s_upgrade_cp_done | default(false) | bool)

    # Retried: this talks to the API server through the VIP, and the control
    # plane's own kubelet restart one play earlier bounces kube-vip, so the
    # first worker can hit a few seconds of "connection refused" here.
    # `kubeadm upgrade node` is idempotent, so re-running is safe.
    - name: Run kubeadm upgrade node
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.command: kubeadm upgrade node
      register: _upgrade_node_kubeadm
      until: _upgrade_node_kubeadm.rc == 0
      retries: 12
      delay: 15
      changed_when: _upgrade_node_kubeadm.rc == 0
      when: not (upgrade_node_is_control_plane | bool)

    # `kubeadm upgrade` regenerates the kube-apiserver static pod manifest and
    # keeps only the flags it manages itself. The --encryption-provider-config
    # wired in out-of-band by playbooks/etcd-encryption-at-rest.yml is dropped
    # every time — and without it the new apiserver cannot read encrypted
    # Secrets, never reports Ready, and the drain below hangs. Re-apply the
    # same idempotent patch this control-plane node already carries the config
    # for. (python3-yaml is a dependency of the encryption playbook, so it is
    # present wherever the config is.)
    - name: Check for an etcd encryption config to restore
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.stat:
        path: /etc/kubernetes/enc/encryption-config.yaml
      register: _upgrade_node_enc
      when: upgrade_node_is_control_plane | bool

    - name: Re-wire the EncryptionConfiguration into the regenerated apiserver manifest
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.script: >
        {{ playbook_dir }}/files/kube-apiserver-encryption-patch.py
        /etc/kubernetes/enc/encryption-config.yaml
      register: _upgrade_node_enc_patch
      changed_when: _upgrade_node_enc_patch.rc == 2
      failed_when: _upgrade_node_enc_patch.rc not in [0, 2]
      when:
        - upgrade_node_is_control_plane | bool
        - _upgrade_node_enc.stat.exists | default(false)

    - name: Wait for the API server to report ready after the manifest patch
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.command: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf get --raw /readyz
      register: _upgrade_node_readyz
      until: _upgrade_node_readyz.rc == 0 and _upgrade_node_readyz.stdout == 'ok'
      retries: 60
      delay: 5
      changed_when: false
      when:
        - upgrade_node_is_control_plane | bool
        - _upgrade_node_enc.stat.exists | default(false)

    # With only two storage nodes, draining one worker leaves every volume on
    # the other; draining the second before Longhorn has rebuilt the first's
    # replicas means the drain waits ~10 min on the last-healthy-replica PDB
    # while the rebuild it needs runs off the node being drained. Gate each
    # drain on no volume being degraded first. No-op where Longhorn isn't
    # installed.
    #
    # "degraded" (attached, missing a replica) is the state a drain must not
    # race. "healthy" is fine; so is "unknown"/"" on a *detached* volume — an
    # idle or scaled-down workload holds no replica the drain could strand, and
    # such a volume never reports "healthy", so waiting for it would just burn
    # the retry budget.
    - name: Check whether Longhorn is installed
      delegate_to: "{{ upgrade_node_kubectl_host }}"
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.command: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf get crd volumes.longhorn.io
      register: _upgrade_node_longhorn
      changed_when: false
      failed_when: false

    - name: Wait until no Longhorn volume is degraded before draining
      delegate_to: "{{ upgrade_node_kubectl_host }}"
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.command: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf -n longhorn-system
        get volumes.longhorn.io -o custom-columns=R:.status.robustness --no-headers
      register: _upgrade_node_lh_vols
      changed_when: false
      until: >-
        _upgrade_node_lh_vols.stdout_lines | map('trim')
        | select('eq', 'degraded') | list | length == 0
      retries: 40
      delay: 15
      when: _upgrade_node_longhorn.rc == 0

    - name: Cordon and drain {{ kubelet_cert_node_name }}
      delegate_to: "{{ upgrade_node_kubectl_host }}"
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.command: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf drain {{ kubelet_cert_node_name }}
        --ignore-daemonsets --delete-emptydir-data --force
        --timeout={{ k8s_upgrade_drain_timeout | default('300s') }}
        {{ k8s_upgrade_drain_extra_args | default('') }}
      register: _upgrade_node_drain
      changed_when: true
      retries: 3
      delay: 15
      until: _upgrade_node_drain.rc == 0

    - name: Unhold kubelet and kubectl
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubelet
        - kubectl

    - name: Install the target kubelet and kubectl
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.apt:
        name:
          - "kubelet={{ kubernetes_package_version }}"
          - "kubectl={{ kubernetes_package_version }}"
        state: present
        allow_downgrade: false
        update_cache: false
      notify: Restart kubelet

    - name: Hold kubelet and kubectl again
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubectl

    - name: Restart the kubelet before going on
      ansible.builtin.meta: flush_handlers

    - name: Wait for the node to report Ready after the kubelet restart
      delegate_to: "{{ upgrade_node_kubectl_host }}"
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.command: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf wait
        --for=condition=Ready node/{{ kubelet_cert_node_name }} --timeout=180s
      register: _upgrade_node_ready
      changed_when: false
      retries: 5
      delay: 15
      until: _upgrade_node_ready.rc == 0

  always:
    # Never leave a node cordoned, even if the block failed after the drain.
    # The block-level `when` above propagates here, so it is not repeated.
    # Retried like the drain/wait tasks: the API may be mid-restart when the
    # block fails, and an un-retried uncordon here would strand the node.
    - name: Uncordon {{ kubelet_cert_node_name }}
      delegate_to: "{{ upgrade_node_kubectl_host }}"
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.command: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf uncordon {{ kubelet_cert_node_name }}
      register: _upgrade_node_uncordon
      until: _upgrade_node_uncordon.rc == 0
      retries: 12
      delay: 10
      changed_when: _upgrade_node_uncordon.rc == 0
