# Gives the UTM host Mac least-privilege remote control of the control plane,
# for the lifecycle scripts installed by playbooks/vm-host-lifecycle.yml.
#
#   ansible-playbook -i inventory/hosts.yml playbooks/vm-ctl-access.yml
#
# Run it BEFORE vm-host-lifecycle.yml, and without --limit: the first play makes
# a key on the Mac and the second authorizes it on the control plane.
#
# WHY NOT JUST AUTHORIZE THE ADMIN LOGIN
#
# The scripts need a few things from the control plane: take an etcd snapshot,
# power the guest off, cordon and uncordon nodes, ask whether the API is ready.
# Handing the Mac the admin account for that means anyone who gets into the Mac
# has passwordless root on the control plane.
#
# WHAT THIS DOES INSTEAD
#
#   - a vm-ctl user: locked password, no shell access, nothing but its key.
#   - the key is restricted with `restrict,command=...`: no pty, no forwarding,
#     and sshd runs ONE script (vm-ctl-ssh) whatever the client asks for. That
#     script compares the requested command, as a whole string, to a fixed list
#     of verbs (vm_ctl_verbs in group_vars/all.yml) and refuses anything else.
#   - each verb is one fixed action in a root-owned script (vm-ctl-root), and
#     /etc/sudoers.d/90-vm-ctl lets vm-ctl run exactly that script with exactly
#     those verbs. No `sudo kubectl`, no admin kubeconfig access beyond what the
#     verbs do.
#   - authorized_keys and ~/.ssh are root-owned, so vm-ctl cannot edit its own
#     restrictions.
#
# WORST CASE with the Mac's key stolen: someone can power off or cordon the
# control plane (an outage), not read Secrets or change workloads.
#
# Same pattern as playbooks/claude-readonly-access.yml's claude-ro user.
- name: Generate the vm-ctl key on the UTM host
  hosts: vm_host

  tasks:
    - name: Ensure ~/.ssh exists
      ansible.builtin.file:
        path: "{{ vm_host_home }}/.ssh"
        state: directory
        mode: "0700"

    - name: Generate a dedicated ed25519 key (kept if it already exists)
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - "vm-ctl@{{ inventory_hostname }}"
          - -f
          - "{{ vm_ctl_key }}"
      args:
        creates: "{{ vm_ctl_key }}"

    - name: Read the public key
      ansible.builtin.slurp:
        src: "{{ vm_ctl_key }}.pub"
      register: vm_ctl_access_pubkey

    - name: Remember it for the control-plane play
      ansible.builtin.set_fact:
        vm_ctl_pubkey: "{{ (vm_ctl_access_pubkey.content | b64decode) | trim }}"

    # The headless runner (playbooks/vm-runner.yml) has its own key, copied to a
    # world-readable file because the runner's directory is private. Authorize it too
    # if the runner has been installed. Installed but no readable key is an error,
    # not a skip: authorized_keys is rewritten below, so a skip would drop the
    # runner's key and its next shutdown would skip the cordon and the snapshot.
    - name: Look for the headless runner
      ansible.builtin.stat:
        path: "/Library/LaunchDaemons/{{ vm_runner_label }}.plist"
      register: vm_ctl_access_runner_plist

    - name: Look for the headless runner's public key
      ansible.builtin.stat:
        path: "{{ vm_runner_home }}/vm-ctl.pub"
      register: vm_ctl_access_runner_pub

    - name: Require the runner's key when the runner is installed
      ansible.builtin.assert:
        that: vm_ctl_access_runner_pub.stat.exists and vm_ctl_access_runner_pub.stat.readable
        fail_msg: >-
          The headless runner is installed but {{ vm_runner_home }}/vm-ctl.pub is
          missing or unreadable by {{ ansible_user_id }}. Run playbooks/vm-runner.yml
          first; it creates the key and publishes it there.
      when: vm_ctl_access_runner_plist.stat.exists or vm_ctl_access_runner_pub.stat.exists

    - name: Read the runner's public key
      ansible.builtin.slurp:
        src: "{{ vm_runner_home }}/vm-ctl.pub"
      register: vm_ctl_access_runner_key
      when: vm_ctl_access_runner_pub.stat.exists

    - name: Remember it for the control-plane play
      ansible.builtin.set_fact:
        vm_runner_pubkey: "{{ (vm_ctl_access_runner_key.content | b64decode) | trim }}"
      when: vm_ctl_access_runner_pub.stat.exists

- name: Create the restricted vm-ctl user on the control plane
  hosts: control_plane
  become: true
  become_method: ansible.builtin.sudo

  tasks:
    - name: Require a UTM host to have generated a key
      ansible.builtin.assert:
        that:
          - groups['vm_host'] | default([]) | length > 0
          - hostvars[groups['vm_host'][0]].vm_ctl_pubkey is defined
        fail_msg: >-
          No vm-ctl public key is available. Add the Mac to the vm_host group in
          inventory/hosts.yml and run this playbook without --limit, so the first
          play generates the key before this one authorizes it.

    - name: Create the vm-ctl user (no usable password)
      ansible.builtin.user:
        name: "{{ vm_ctl_user }}"
        comment: "Restricted remote control for the UTM host"
        shell: /bin/bash
        # "*" never matches a password but, unlike a "!"-locked account, still
        # lets sshd accept the key.
        password: "*"
        create_home: true

    - name: Install the root-run verbs
      ansible.builtin.template:
        src: templates/vm-ctl-root.sh.j2
        dest: "{{ vm_ctl_root_bin }}"
        owner: root
        group: root
        mode: "0755"

    - name: Install the sshd forced command
      ansible.builtin.template:
        src: templates/vm-ctl-ssh.sh.j2
        dest: "{{ vm_ctl_ssh_bin }}"
        owner: root
        group: root
        mode: "0755"

    - name: Allow vm-ctl to run exactly the verbs through sudo
      ansible.builtin.template:
        src: templates/vm-ctl-sudoers.j2
        dest: "/etc/sudoers.d/90-{{ vm_ctl_user }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    # Root-owned on purpose: sshd's StrictModes accepts that, and it means the
    # vm-ctl user cannot loosen its own key restrictions.
    - name: Create a root-owned ~/.ssh for vm-ctl
      ansible.builtin.file:
        path: "/home/{{ vm_ctl_user }}/.ssh"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The Mac user's key, plus the headless runner's when it exists. Both are
    # restricted to the same forced command.
    - name: Work out which keys to authorize
      ansible.builtin.set_fact:
        vm_ctl_access_keys: >-
          {{ [hostvars[groups['vm_host'][0]].vm_ctl_pubkey]
          + ([hostvars[groups['vm_host'][0]].vm_runner_pubkey]
          if hostvars[groups['vm_host'][0]].vm_runner_pubkey is defined else []) }}

    - name: Authorize the keys, restricted to the forced command
      ansible.builtin.copy:
        dest: "/home/{{ vm_ctl_user }}/.ssh/authorized_keys"
        content: |
          {% for key in vm_ctl_access_keys %}
          restrict,command="{{ vm_ctl_ssh_bin }}" {{ key }}
          {% endfor %}
        owner: root
        group: root
        mode: "0644"

    - name: Say how to test it
      ansible.builtin.debug:
        msg: >-
          From the Mac: ssh -i {{ hostvars[groups['vm_host'][0]].vm_ctl_key }}
          -o IdentitiesOnly=yes {{ vm_ctl_user }}@{{ ansible_host }} ping
          should print "ok". Anything outside {{ vm_ctl_verbs | join(', ') }}
          is refused.
