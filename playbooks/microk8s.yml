- name: Setup MicroK8s
  hosts: all

  tasks:
    - name: Install MicroK8s
      become: true
      become_method: ansible.builtin.sudo
      community.general.snap:
        name: microk8s
        classic: true
        state: present
    - name: Add User
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.user:
        name: '{{ ansible_user_id }}'
        append: true
        groups:
          - microk8s

- name: Setup C-Groups for pis
  hosts: pis

  tasks:
    - name: Check C groups
      ansible.builtin.shell: grep -c 'cgroup_enable=memory cgroup_memory=1 swapaccount=1' /boot/firmware/cmdline.txt || true
      changed_when: false
      register: c_groups
    - name: Append Groups
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.lineinfile:
        path: /boot/firmware/cmdline.txt
        regexp: "^(.*rootwait quiet.*)$"
        line: '\1 cgroup_enable=memory cgroup_memory=1 swapaccount=1'
        backrefs: true
      when: c_groups.stdout == "0"
