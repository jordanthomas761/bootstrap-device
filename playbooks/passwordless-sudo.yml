# One-time setup: grants the connecting SSH user passwordless sudo on every
# cluster host, so main.yml and the other playbooks never hit "Missing sudo
# password" again. Since this itself needs sudo, run it once with -K to supply
# the password interactively:
#
#   ansible-playbook -i inventory/hosts.yml playbooks/passwordless-sudo.yml -K
#
# Scoped to the cluster nodes. The macOS `inference` host is excluded on
# purpose — pass `-l inference` (still with -K) if you want it there too.
- name: Grant passwordless sudo to the connecting user
  hosts: control_plane:workers

  tasks:
    - name: Drop a sudoers.d entry for the connecting user
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.copy:
        content: "{{ ansible_user_id }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/90-{{ ansible_user_id }}-nopasswd"
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
