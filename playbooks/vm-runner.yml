# Installs the headless QEMU runner for the control-plane VM on the Mac that
# hosts it, so the VM starts at boot with nobody logged in.
#
#   ansible-playbook -i inventory/hosts.yml playbooks/vm-runner.yml -K
#
# This only INSTALLS. It does not start anything unless you pass
# -e vm_runner_load=true, which is the last step of the cutover. The full
# procedure, and how to roll back, is in the README ("Headless control-plane VM").
#
# WHAT IT SETS UP
#
#   - an unprivileged, hidden service user (vm_runner_user) with no login shell
#   - /opt/vm-runner/controlplane (disk, EFI variables, firmware copy, QMP socket,
#     serial log, the runner's own ssh key), owned by that user, 0700
#   - a root-owned supervisor script and a boot-time LaunchDaemon that runs it
#     as the service user
#
# WHAT IT NEEDS FIRST (checked below, not installed here)
#
#   - Homebrew QEMU (`brew install qemu`)
#   - socket_vmnet from a root-owned prefix, with its bridged LaunchDaemon
#     running. Not Homebrew's build: its README warns that admin-group users can
#     replace a binary root runs. Install steps are in the README.
#
# ORDER
#
#   1. this playbook (creates the runner's ssh key)
#   2. playbooks/vm-ctl-access.yml (authorizes that key as the restricted vm-ctl
#      user on the control plane; the supervisor uses it for the snapshot and the
#      cordon/uncordon)
#   3. the manual cutover, then this playbook again with -e vm_runner_load=true
- name: Install the headless QEMU runner
  hosts: vm_host
  become: true
  become_method: ansible.builtin.sudo

  tasks:
    - name: Assert this is an Apple-Silicon Mac
      ansible.builtin.assert:
        that:
          - ansible_facts.system == "Darwin"
          - ansible_facts.architecture == "arm64"
        fail_msg: playbooks/vm-runner.yml targets the Apple-Silicon Mac that hosts the VM.

    - name: Check the prerequisites
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ vm_qemu_bin }}"
        - "{{ vm_socket_vmnet_client }}"
        - "{{ vm_socket_vmnet_socket }}"
      register: vm_runner_prereqs

    - name: Require them
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: >-
          {{ item.item }} does not exist. QEMU comes from `brew install qemu`;
          socket_vmnet and its bridged daemon are installed per the README.
      loop: "{{ vm_runner_prereqs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create the service user
      ansible.builtin.user:
        name: "{{ vm_runner_user }}"
        uid: "{{ vm_runner_uid }}"
        group: "{{ vm_runner_group }}"
        home: "{{ vm_runner_home }}"
        shell: /usr/bin/false
        create_home: false
        hidden: true
        comment: "Control-plane VM runner"

    - name: Create the VM directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ vm_runner_group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ vm_runner_home }}", owner: root, mode: "0755" }
        # 0700: the serial console log and runner.log are not for every staff user.
        - { path: "{{ vm_runner_dir }}", owner: "{{ vm_runner_user }}", mode: "0700" }
        - { path: "{{ vm_runner_dir }}/.ssh", owner: "{{ vm_runner_user }}", mode: "0700" }
      loop_control:
        label: "{{ item.path }}"

    # Generated as root and then handed over, not with become_user: Ansible cannot
    # become an unprivileged user on macOS (it shares its temp files with a
    # Linux-style ACL chmod that macOS rejects), so the task would fail.
    - name: Generate the runner's vm-ctl key (kept if it exists)
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - "vm-runner@{{ inventory_hostname }}"
          - -f
          - "{{ vm_runner_dir }}/.ssh/id_ed25519_vm_ctl"
      args:
        creates: "{{ vm_runner_dir }}/.ssh/id_ed25519_vm_ctl"

    - name: Hand the key pair to the service user
      ansible.builtin.file:
        path: "{{ vm_runner_dir }}/.ssh/{{ item.name }}"
        owner: "{{ vm_runner_user }}"
        group: "{{ vm_runner_group }}"
        mode: "{{ item.mode }}"
      loop:
        - { name: id_ed25519_vm_ctl, mode: "0600" }
        - { name: id_ed25519_vm_ctl.pub, mode: "0644" }

    # The runner's directory is private (0700), so playbooks/vm-ctl-access.yml
    # reads the public half from the root-owned parent instead.
    - name: Publish the runner's public key where vm-ctl-access can read it
      ansible.builtin.copy:
        src: "{{ vm_runner_dir }}/.ssh/id_ed25519_vm_ctl.pub"
        dest: "{{ vm_runner_home }}/vm-ctl.pub"
        remote_src: true
        owner: root
        group: wheel
        mode: "0644"

    - name: Remove the old copy of the public key
      ansible.builtin.file:
        path: "{{ vm_runner_dir }}/vm-ctl.pub"
        state: absent

    # By IP, so the runner does not depend on DNS at boot (see vm_guest_ip).
    - name: Resolve the control plane's address on the Mac
      ansible.builtin.command:
        argv: [dscacheutil, -q, host, -a, name, "{{ cluster_cp_host }}"]
      register: vm_runner_cp_lookup
      changed_when: false
      when: not vm_guest_ip

    - name: Pick the guest address
      ansible.builtin.set_fact:
        vm_runner_guest_ip: >-
          {{ vm_guest_ip if vm_guest_ip else
          (vm_runner_cp_lookup.stdout | regex_findall('(?m)^ip_address: (\S+)') | first | default('')) }}

    - name: Require an IPv4 address for the guest
      ansible.builtin.assert:
        that: vm_runner_guest_ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: >-
          Could not resolve {{ cluster_cp_host }} to an IPv4 address on {{ inventory_hostname }}
          (got "{{ vm_runner_guest_ip }}"). Set vm_guest_ip in inventory/group_vars/vm_host.yml.

    - name: Create the root-owned script directory
      ansible.builtin.file:
        path: "{{ vm_runner_bin_dir }}"
        state: directory
        owner: root
        group: wheel
        mode: "0755"

    - name: Install the supervisor script
      ansible.builtin.template:
        src: templates/vm-runner.sh.j2
        dest: "{{ vm_runner_bin_dir }}/vm-runner"
        owner: root
        group: wheel
        mode: "0755"

    # socket_vmnet can hang during vmnet setup after a reboot while its socket
    # file still exists, so the VM boots with no network. The runner restarts it
    # before every start, once the Mac's network is up. It is not root, so it
    # gets one sudo rule: restart that one daemon, with those exact arguments.
    # macOS's /etc/sudoers reads /private/etc/sudoers.d.
    - name: Check that sudoers.d is read
      ansible.builtin.command:
        argv: [grep, -Eq, '^[#@]includedir /private/etc/sudoers.d', /etc/sudoers]
      changed_when: false

    - name: Let the runner restart socket_vmnet, and nothing else
      ansible.builtin.copy:
        dest: /private/etc/sudoers.d/vm-runner
        content: |
          # Managed by playbooks/vm-runner.yml
          {{ vm_runner_user }} ALL=(root) NOPASSWD: /bin/launchctl kickstart -k system/{{ vm_socket_vmnet_label }}
        owner: root
        group: wheel
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Install the LaunchDaemon
      ansible.builtin.template:
        src: templates/vm-runner.plist.j2
        dest: "/Library/LaunchDaemons/{{ vm_runner_label }}.plist"
        owner: root
        group: wheel
        mode: "0644"
      register: vm_runner_plist

    - name: Say where things stand
      ansible.builtin.debug:
        msg: >-
          Installed (guest at {{ vm_runner_guest_ip }}). {{ 'Loading the daemon
          if needed.' if vm_runner_load | bool else 'Not loaded: this was an
          install only. After the cutover, rerun with -e vm_runner_load=true.' }}
          A running VM keeps its current script until its next start.

    # The UTM-based agents from playbooks/vm-host-lifecycle.yml must go before the
    # runner starts: their login agent would start the now-stale UTM VM, with the
    # same MAC and IP, next to the runner's. bootout from root works on a user's
    # gui domain; the plists are removed so they do not return at next login.
    # This play runs under sudo, so ansible_user_id (and therefore vm_host_home)
    # is root. The agents belong to the person who ran ansible: SUDO_USER.
    - name: Work out whose LaunchAgents are being retired
      ansible.builtin.set_fact:
        vm_runner_login_user: "{{ ansible_facts.env.SUDO_USER | default(vm_host_user) }}"
      when: vm_runner_load | bool

    - name: Look up the login user's home (for the agents being retired)
      ansible.builtin.stat:
        path: "/Users/{{ vm_runner_login_user }}"
      register: vm_runner_login_home
      when: vm_runner_load | bool

    - name: Require that home
      ansible.builtin.assert:
        that: vm_runner_login_home.stat.exists
        fail_msg: >-
          /Users/{{ vm_runner_login_user }} does not exist, so the UTM agents
          cannot be found. Set vm_host_user for this host.
      when: vm_runner_load | bool

    - name: Retire the UTM-based LaunchAgents (cutover only)
      ansible.builtin.shell: |
        launchctl bootout gui/{{ vm_runner_login_home.stat.uid }}/{{ vm_lifecycle_label_prefix }}.{{ item }} 2>/dev/null || true
        rm -f "/Users/{{ vm_runner_login_user }}/Library/LaunchAgents/{{ vm_lifecycle_label_prefix }}.{{ item }}.plist"
      loop:
        - shutdown-hook
        - startup
        - shutdown-run
      when: vm_runner_load | bool
      changed_when: true

    # Loading starts QEMU. A job that is already loaded is left alone unless its
    # plist changed: reloading means a full graceful stop of the control plane
    # (cordon, snapshot, ~90 s ACPI shutdown). When it must reload, wait for the
    # old QEMU to be gone before bootstrapping, or the new instance would see it.
    - name: Check whether the daemon is loaded
      ansible.builtin.command:
        argv: [launchctl, print, "system/{{ vm_runner_label }}"]
      register: vm_runner_loaded
      changed_when: false
      failed_when: false
      when: vm_runner_load | bool

    - name: Load the daemon (cutover, or a changed plist)
      ansible.builtin.shell: |
        set -eu
        if launchctl print system/{{ vm_runner_label }} >/dev/null 2>&1; then
          echo "reloading: stopping the running VM gracefully"
          launchctl bootout system/{{ vm_runner_label }} || true
          waited=0
          while pgrep -f "qemu-system-aarch64.*-name {{ vm_name }}" >/dev/null; do
            if [ "$waited" -ge {{ vm_runner_exit_timeout }} ]; then
              echo "QEMU for {{ vm_name }} is still running after {{ vm_runner_exit_timeout }}s" >&2
              exit 1
            fi
            sleep 2
            waited=$((waited + 2))
          done
        fi
        launchctl bootstrap system /Library/LaunchDaemons/{{ vm_runner_label }}.plist
        launchctl enable system/{{ vm_runner_label }}
      when:
        - vm_runner_load | bool
        - vm_runner_loaded.rc != 0 or vm_runner_plist.changed
      changed_when: true
