---
- name: Check if this node is already an initialized control plane
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_control_plane_admin_conf

- name: Copy the cluster-admins ClusterRoleBinding manifest
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.copy:
    src: kubeadm-cluster-admins-crb.yaml
    dest: /etc/kubernetes/kubeadm-cluster-admins-crb.yaml
    mode: "0600"

# kube-vip needs Lease access to claim the VIP, but kubeadm only creates the
# kubeadm:cluster-admins ClusterRoleBinding AFTER its own health check succeeds —
# and that health check goes through the VIP. Deadlock. Fix: start init in the
# background, wait for etcd/kube-apiserver to actually be up via crictl, then
# create the binding ourselves through super-admin.conf (which doesn't depend
# on the binding), unblocking kube-vip so the health check can pass.
- name: Start kubeadm init (async, only on a fresh node)
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: >
    kubeadm init
    --control-plane-endpoint={{ k8s_vip }}:{{ k8s_control_plane_endpoint_port }}
    --apiserver-advertise-address={{ ansible_default_ipv4.address }}
    --pod-network-cidr={{ k8s_pod_network_cidr }}
    --kubernetes-version={{ kubernetes_version }}
  async: 900
  poll: 0
  register: k8s_control_plane_kubeadm_init_job
  when: not k8s_control_plane_admin_conf.stat.exists

- name: Wait for the etcd container to be running
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: crictl ps --name etcd --state Running -q
  register: k8s_control_plane_etcd_check
  changed_when: false
  until: k8s_control_plane_etcd_check.stdout | trim | length > 0
  retries: 60
  delay: 5

- name: Wait for the kube-apiserver container to be running
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: crictl ps --name kube-apiserver --state Running -q
  register: k8s_control_plane_apiserver_check
  changed_when: false
  until: k8s_control_plane_apiserver_check.stdout | trim | length > 0
  retries: 60
  delay: 5

# Idempotent apply — this also covers re-runs after a manual `kubeadm reset`,
# which wipes this binding every time even though admin.conf/super-admin.conf
# get regenerated by the next init.
- name: Apply the kubeadm:cluster-admins ClusterRoleBinding via super-admin.conf
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/super-admin.conf
    apply -f /etc/kubernetes/kubeadm-cluster-admins-crb.yaml
  register: k8s_control_plane_crb_apply
  until: k8s_control_plane_crb_apply.rc == 0
  retries: 30
  delay: 5
  changed_when: "'unchanged' not in k8s_control_plane_crb_apply.stdout"

- name: Wait for kubeadm init to finish
  ansible.builtin.async_status:
    jid: "{{ k8s_control_plane_kubeadm_init_job.ansible_job_id }}"
  register: k8s_control_plane_kubeadm_init_result
  until: k8s_control_plane_kubeadm_init_result.finished
  retries: 60
  delay: 10
  when: not k8s_control_plane_admin_conf.stat.exists

- name: Fail if kubeadm init did not succeed
  ansible.builtin.fail:
    msg: >-
      kubeadm init failed:
      {{ k8s_control_plane_kubeadm_init_result.stderr |
         default(k8s_control_plane_kubeadm_init_result.msg | default('unknown error')) }}
  when:
    - not k8s_control_plane_admin_conf.stat.exists
    - k8s_control_plane_kubeadm_init_result.rc | default(0) != 0

- name: Verify the API server is reachable via the VIP
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf
    --server=https://{{ k8s_vip }}:{{ k8s_control_plane_endpoint_port }}
    get --raw=/healthz
  register: k8s_control_plane_vip_healthz
  until: k8s_control_plane_vip_healthz.rc == 0
  retries: 30
  delay: 5
  changed_when: false
