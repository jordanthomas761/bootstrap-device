---
# ArgoCD is bootstrapped imperatively here, same as kube-vip and Cilium — it
# manages everything else in the cluster via GitOps (homelab-infra) but can't
# manage its own initial install. Applying root-app.yaml below hands control
# of everything else in the cluster to ArgoCD/GitOps. Dex SSO wiring is the
# one deliberate follow-up step NOT done here — see playbooks/argocd-dex-sso.yml.

- name: Check if the argocd namespace already exists
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf
    get namespace {{ argocd_namespace }}
  register: k8s_control_plane_argocd_ns_check
  failed_when: >-
    k8s_control_plane_argocd_ns_check.rc != 0 and
    'NotFound' not in k8s_control_plane_argocd_ns_check.stderr
  changed_when: false

- name: Create the argocd namespace
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf
    create namespace {{ argocd_namespace }}
  when: k8s_control_plane_argocd_ns_check.rc != 0
  changed_when: true

# --server-side is required, not a preference. A client-side apply copies the
# entire manifest into the kubectl.kubernetes.io/last-applied-configuration
# annotation, and applicationsets.argoproj.io is large enough that the copy
# exceeds the 262144-byte ceiling on annotations:
#
#   The CustomResourceDefinition "applicationsets.argoproj.io" is invalid:
#   metadata.annotations: Too long: must have at most 262144 bytes
#
# Everything before it in the manifest applies, the CRD does not, and the task
# fails with a partial install. Server-side apply keeps field ownership in
# managedFields instead and writes no such annotation, so the size problem
# does not arise.
#
# The homelab-infra repo hits the same class of failure from the other side --
# see the ServerSideApply=true syncOption on apps/kube-prometheus-stack, where
# six oversized prometheus-operator CRDs blew through etcd's 1.5MB request cap
# for the same reason.
#
# --force-conflicts is needed on the migration: these objects already carry
# fields owned by the "kubectl-client-side-apply" manager from previous runs,
# and without it every one of them reports a conflict instead of applying.
# It does not widen what this task already touches -- the client-side apply it
# replaces was overwriting the same objects on every run (argocd-cm included,
# per the "configured" lines in its output).
- name: Install ArgoCD (non-HA manifest)
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf
    apply --server-side --force-conflicts -n {{ argocd_namespace }}
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
  register: k8s_control_plane_argocd_apply
  # "serverside-applied" is the wording server-side apply uses; a client-side
  # apply says "created"/"configured". Both are matched because dropping the
  # old terms would misreport any run that still went client-side, and
  # dropping the new one would make this task permanently report "ok" while
  # silently changing things.
  changed_when: k8s_control_plane_argocd_apply.stdout is search('created|configured|serverside-applied')

# The gateway (homelab-infra apps/gateway-config) terminates TLS and forwards
# plain HTTP to argocd-server:80. Left at its default, argocd-server serves
# TLS itself and 307s every plaintext request to https://<host>/ — which comes
# straight back through the same gateway, gets terminated again, and forwarded
# as plaintext again: an infinite redirect loop, not a broken certificate.
# server.insecure stops argocd-server doing its own TLS/redirect and lets the
# gateway own it. Merge-patched so the other keys in argocd-cmd-params-cm are
# left alone.
- name: Set server.insecure on argocd-cmd-params-cm (TLS terminates at the gateway)
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf
    -n {{ argocd_namespace }} patch configmap argocd-cmd-params-cm
    --type merge -p '{"data":{"server.insecure":"true"}}'
  register: k8s_control_plane_argocd_insecure_patch
  changed_when: k8s_control_plane_argocd_insecure_patch.stdout is search('patched')
    and 'no change' not in k8s_control_plane_argocd_insecure_patch.stdout
  notify: Restart argocd-server

# Flushed immediately rather than left to the end of the play, so the rollout
# status check below waits on the restarted pod and not the outgoing one.
- name: Restart argocd-server now if the patch changed anything
  ansible.builtin.meta: flush_handlers

- name: Wait for the argocd-server deployment to be available
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf
    -n {{ argocd_namespace }} rollout status deployment/argocd-server --timeout=300s
  register: k8s_control_plane_argocd_rollout
  changed_when: false

# The Application CRD is applied as part of install.yaml above but can take a
# few seconds to become Established — retry rather than race it.
# Argo CD needs the repository credential BEFORE root-app is applied. Applied
# the other way round, root-app lands, immediately fails to clone, and the
# cluster sits in a broken GitOps state until someone notices.
- name: Install the Argo CD repository credential for homelab-infra
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.template:
    src: argocd-repo-secret.yaml.j2
    dest: /tmp/argocd-repo-secret.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  changed_when: false

- name: Apply the repository credential
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf
    apply -n {{ argocd_namespace }} -f /tmp/argocd-repo-secret.yaml
  register: k8s_control_plane_repo_secret
  changed_when: k8s_control_plane_repo_secret.stdout is search('created|configured')

# The rendered Secret holds the private key in cleartext; it has served its
# purpose once applied.
- name: Remove the rendered credential from disk
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.file:
    path: /tmp/argocd-repo-secret.yaml
    state: absent

- name: Render root-app.yaml locally
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.template:
    src: root-app.yaml.j2
    dest: /tmp/root-app.yaml
    owner: root
    group: root
    mode: "0644"
  changed_when: false

- name: Apply homelab-infra's root-app.yaml (hands the cluster to GitOps)
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf
    apply -n {{ argocd_namespace }}
    -f /tmp/root-app.yaml
  register: k8s_control_plane_root_app_apply
  until: k8s_control_plane_root_app_apply.rc == 0
  retries: 12
  delay: 5
  changed_when: k8s_control_plane_root_app_apply.stdout is search('created|configured')

- name: Remind about the initial admin password and next steps
  ansible.builtin.debug:
    msg: >-
      ArgoCD {{ argocd_version }} is installed in the {{ argocd_namespace }}
      namespace and
      root-app.yaml is applied — ArgoCD will now sync everything under
      homelab-infra's apps/ (Cilium/kube-vip/ArgoCD itself excepted, those
      stay imperative). Initial admin password:
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      -n {{ argocd_namespace }} get secret
      argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d.
      One thing is NOT done here, on purpose: Dex SSO login — run
      playbooks/argocd-dex-sso.yml once Dex is up via GitOps and the shared
      client secret is generated/sealed.
