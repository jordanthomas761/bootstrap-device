---
- name: Template the kube-vip static pod manifest
  ansible.builtin.import_tasks: kube_vip.yml

- name: Run kubeadm init and fix the kube-vip/RBAC deadlock
  ansible.builtin.import_tasks: kubeadm_init.yml

- name: Install the Cilium CNI
  ansible.builtin.import_tasks: cni.yml

- name: Install ArgoCD
  ansible.builtin.import_tasks: argocd.yml
