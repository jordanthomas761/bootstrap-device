---
- name: Check if this node is already joined to the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_worker_kubelet_conf

- name: Generate a fresh join command on the control plane
  ansible.builtin.command: kubeadm token create --print-join-command
  register: k8s_worker_join_command
  delegate_to: "{{ groups['control_plane'][0] }}"
  become: true
  become_method: ansible.builtin.sudo
  when: not k8s_worker_kubelet_conf.stat.exists
  changed_when: false
  no_log: true

- name: Join the cluster
  ansible.builtin.command: "{{ k8s_worker_join_command.stdout }}"
  become: true
  become_method: ansible.builtin.sudo
  when: not k8s_worker_kubelet_conf.stat.exists
  changed_when: true
  no_log: true
