---
- name: Install apt prerequisites for the Kubernetes repo
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present

# Re-enabled. The "CDN block" these tasks were disabled for was never a block:
# the URL was missing the "v" prefix and pkgs.k8s.io answered 403, exactly as
# it did for the repo URI itself. Verified:
#
#   core:/stable:/1.31/deb/Release.key   -> 403
#   core:/stable:/v1.31/deb/Release.key  -> 200 (1738 bytes, ASCII-armoured)
#
# Fetched once on the control node and copied out, rather than once per host.
- name: Fetch Kubernetes apt signing key once
  delegate_to: localhost
  run_once: true
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_series }}/deb/Release.key"
    dest: "/tmp/kubernetes-{{ kubernetes_series }}-release.key"
    mode: "0644"
  register: k8s_common_release_key_fetch
  until: k8s_common_release_key_fetch is succeeded
  retries: 5
  delay: 15

- name: Ensure apt keyrings directory exists
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Kubernetes apt signing key
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.copy:
    src: "/tmp/kubernetes-{{ kubernetes_series }}-release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"
  # The key change alone has to trigger the refresh. Only the repo task below
  # notified this handler, which is fine on the run that first switches from
  # trusted: true to signed_by -- the repo definition changes too, so it
  # fires. It is not fine afterwards: on a run where the key rotates and the
  # repo definition is already correct, nothing would notify, apt would keep
  # serving the cached index, and the new key would go unexercised until some
  # unrelated change happened to refresh it.
  notify: Update Kubernetes apt cache

# The deb822_repository task below owns the Kubernetes repo as
# /etc/apt/sources.list.d/kubernetes.sources. An older one-line
# kubernetes.list may still be present from a previous bootstrap, and leaving
# it alongside is not harmless:
#
#   - apt sees the same repo configured twice and warns on every run
#   - that file pins signed-by to a .gpg keyring whose signature apt 3.x on
#     trixie now rejects outright ("Signature Packet v3 is not considered
#     secure since 2026-02-01"), because it verifies with sqv rather than
#     gpgv
#
# Removing it makes the .sources file the single source of truth. Safe: the
# packages it installed stay installed, and the repo it provided is the same
# one, now declared correctly above.
- name: Remove the superseded one-line Kubernetes apt source
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/kubernetes.list
    state: absent
  notify: Update Kubernetes apt cache

- name: Add Kubernetes apt repository
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    # The "v" prefix is required and is NOT part of kubernetes_series, which
    # is a bare "1.31" so it can also build the package version pin. Without
    # it pkgs.k8s.io answers 403 Forbidden for Packages and InRelease --
    # verified: core:/stable:/1.31/deb/Packages -> 403,
    # core:/stable:/v1.31/deb/Packages -> 200. Both forms 302 on /Release,
    # so a redirect check is not enough to catch this.
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_series }}/deb/"
    suites: /
    # Verify against the key installed above rather than trusting the repo
    # blindly. `trusted: true` was a workaround for the key fetch being
    # disabled, and it does not merely relax a warning -- it disables
    # signature verification for this repo entirely, so anything able to
    # answer for the CDN could serve packages that install as root.
    #
    # It also masked a real failure: with the key absent, apt reported
    # NO_PUBKEY 234654DA9A296436, kept using the stale index and exited 0 --
    # but ansible.builtin.apt is stricter than apt-get and failed the play on
    # the same condition, with an empty error message. That is the
    # "Failed to update apt cache after 5 retries: " with nothing after the
    # colon.
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.asc
  notify: Update Kubernetes apt cache

- name: Apply pending Kubernetes apt cache update
  ansible.builtin.meta: flush_handlers

- name: Install kubelet, kubeadm, and kubectl (pinned)
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_package_version }}"
      - "kubeadm={{ kubernetes_package_version }}"
      - "kubectl={{ kubernetes_package_version }}"
    state: present
    allow_downgrade: true

- name: Hold kubelet, kubeadm, and kubectl at the pinned version
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Ensure kubelet is enabled
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started
