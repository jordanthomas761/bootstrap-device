---
- name: Install containerd
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Check for existing containerd config
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: k8s_common_containerd_config_stat

- name: Read existing containerd config
  ansible.builtin.slurp:
    src: /etc/containerd/config.toml
  register: k8s_common_containerd_config_raw
  when: k8s_common_containerd_config_stat.stat.exists

- name: Determine if containerd config needs (re)generating
  ansible.builtin.set_fact:
    k8s_common_containerd_config_needs_regen: >-
      {{ not k8s_common_containerd_config_stat.stat.exists or
         ((k8s_common_containerd_config_raw.content | b64decode) is search('disabled_plugins\s*=\s*\[[^\]]*"cri"[^\]]*\]')) }}

- name: Generate clean containerd default config
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  when: k8s_common_containerd_config_needs_regen
  changed_when: true
  notify: Restart containerd

- name: Set SystemdCgroup = true in containerd config
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)SystemdCgroup\s*=\s*false'
    replace: '\1SystemdCgroup = true'
  notify: Restart containerd

# containerd's own default (Debian's build in particular) points CNI bin_dir
# at /usr/lib/cni, but Cilium installs its plugins (cilium-cni, loopback) to
# /opt/cni/bin — left mismatched, every pod sandbox fails to create with
# "failed to find plugin ... in path [/usr/lib/cni]".
- name: Point containerd's CNI bin_dir at where Cilium installs its plugins
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)bin_dir\s*=\s*".*"'
    replace: '\1bin_dir = "/opt/cni/bin"'
  notify: Restart containerd

# Populate EVERY empty config_path in config.toml, not just the registry
# table's. This looks blunt and is deliberate -- which key matters depends on
# the containerd major, and on 2.x it is NOT the registry one.
#
# containerd 1.7 (the Debian workers):
#   [plugins."io.containerd.grpc.v1.cri".registry]
#     config_path = ""          <- the CRI plugin pulls, and reads this
#
# containerd 2.x (the Ubuntu control plane):
#   [plugins.'io.containerd.cri.v1.images']
#     use_local_image_pull = false   <- pulls are DELEGATED to the transfer
#                                       service, not done by the CRI plugin
#   [plugins.'io.containerd.cri.v1.images'.registry]
#     config_path = '/etc/containerd/certs.d:/etc/docker/certs.d'
#                                   <- already correct out of the box, and
#                                      IRRELEVANT to pulls while the above is
#                                      false
#   [plugins.'io.containerd.transfer.v1.local']
#     config_path = ''          <- the key that actually governs mirroring
#
# Verified the hard way on this cluster: with only the registry path set, the
# control plane pulled a fresh image and the cache logged zero requests, while
# DNS and HTTPS to the cache both worked fine from that node. It was silently
# taking the hosts.toml fallback to the upstream registry every time.
#
# Setting every empty config_path is safe because the value is only ever read
# as "where do I find registry hosts.toml files", and pointing any puller at
# the same directory is exactly the intent. It is idempotent for the usual
# reason: the pattern matches empty values only.
- name: Point containerd at the registry configuration directory
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    # Both quotings, because 1.7 emits "" and 2.x emits ''. Anchored on the
    # exact key so it cannot touch plugin_config_path, which merely contains
    # "config_path" as a substring.
    regexp: "^(\\s*)config_path\\s*=\\s*(''|\"\")\\s*$"
    replace: '\1config_path = "{{ k8s_common_registry_certs_dir }}"'
  notify: Restart containerd
  # Part of the registry-mirrors tag: without this task the hosts.toml files
  # are written but never read, so a tagged run has to include it.
  tags:
    - registry-mirrors

# containerd 2.x only -- the key does not exist on 1.7, where this is a no-op.
#
# With use_local_image_pull = false (the 2.x default) the CRI plugin hands
# pulls to the Transfer Service, and upstream's own compatibility table gives
# that path only partial registry support, against "all supported" for the
# client-based local pull. Setting it true puts the control plane on the same
# pull path as the 1.7 workers, which demonstrably use the caches.
#
# This was arrived at the hard way. Populating the Transfer Service's own
# config_path was not enough on its own: with the certs directory set on both
# that plugin AND the registry table, containerd restarted, hosts.toml files
# in place, DNS resolving and HTTPS to the cache working from the node, a
# fresh `crictl pull` still completed in ~700ms with the cache logging zero
# requests. containerd's own journal showed no mirror resolution at all.
- name: Use the local image pull path so registry mirrors are honoured
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)use_local_image_pull\s*=\s*false\s*$'
    replace: '\1use_local_image_pull = true'
  notify: Restart containerd
  tags:
    - registry-mirrors

- name: Ensure containerd is enabled and running
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
