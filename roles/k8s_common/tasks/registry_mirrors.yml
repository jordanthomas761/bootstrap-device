---
# Point containerd at the in-cluster pull-through caches (homelab-infra,
# apps/registry-cache). Runs after containerd.yml, which is what sets
# `config_path` in config.toml to the directory these files land in -- without
# that line containerd never reads this directory at all.

- name: Create the containerd registry configuration directory
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.file:
    path: "{{ k8s_common_registry_certs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create a directory per mirrored registry
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.file:
    path: "{{ k8s_common_registry_certs_dir }}/{{ item.upstream }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ k8s_common_registry_mirrors }}"
  loop_control:
    label: "{{ item.upstream }}"

- name: Write the hosts.toml for each mirrored registry
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: "{{ k8s_common_registry_certs_dir }}/{{ item.upstream }}/hosts.toml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ k8s_common_registry_mirrors }}"
  loop_control:
    label: "{{ item.upstream }}"
  # No handler notification on purpose: containerd re-reads certs.d on every
  # pull and does not need restarting for these. Only config.toml changes do,
  # and containerd.yml owns those.

# Everything above is inert unless containerd actually loaded config_path.
# That line is edited by regex in containerd.yml against a file generated by
# `containerd config default`, whose exact quoting differs between containerd
# 1.7 (workers, Debian trixie) and 2.x (control plane, Ubuntu 24.04). If the
# regex ever stops matching, the failure is silent -- pulls keep succeeding,
# they just never touch the cache and nobody notices for months. So assert it
# against containerd's own resolved view rather than trusting the edit.
- name: Read containerd's resolved configuration
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: containerd config dump
  register: k8s_common_containerd_config_dump
  changed_when: false

- name: Assert containerd is reading the registry configuration directory
  ansible.builtin.assert:
    that:
      - k8s_common_registry_certs_dir in k8s_common_containerd_config_dump.stdout
    fail_msg: >-
      containerd on {{ inventory_hostname }} is not reading
      {{ k8s_common_registry_certs_dir }}, so the hosts.toml files just written
      are ignored and every pull still goes straight to the upstream registry.
      See what it actually resolved with:
      `sudo containerd config dump | grep -n config_path`. Then, in the order
      worth checking:
      (1) the value is empty -- the `Point containerd at the registry
      configuration directory` task in containerd.yml did not match this
      node's config.toml. Compare the quoting (containerd 1.7 emits "" and 2.x
      emits '') and the enclosing table, which also differs between the two
      majors.
      (2) the value is a different, deliberately-chosen directory -- then set
      `k8s_common_registry_certs_dir` to that path (per-host or per-group)
      rather than changing the node, and this role will write the hosts.toml
      files where containerd already looks.
      (3) the value looks right but containerd still is not using it --
      check whether the unit passes `--config` somewhere other than
      /etc/containerd/config.toml, in which case the file being edited is not
      the file in use.
    success_msg: >-
      containerd is reading {{ k8s_common_registry_certs_dir }}
      ({{ k8s_common_registry_mirrors | length }} mirrors configured)
