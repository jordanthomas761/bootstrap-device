---
# Point containerd at the in-cluster pull-through caches (homelab-infra,
# apps/registry-cache). Runs after containerd.yml, which is what sets
# `config_path` in config.toml to the directory these files land in -- without
# that line containerd never reads this directory at all.

- name: Create the containerd registry configuration directory
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.file:
    path: "{{ k8s_common_registry_certs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create a directory per mirrored registry
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.file:
    path: "{{ k8s_common_registry_certs_dir }}/{{ item.upstream }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ k8s_common_registry_mirrors }}"
  loop_control:
    label: "{{ item.upstream }}"

- name: Write the hosts.toml for each mirrored registry
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: "{{ k8s_common_registry_certs_dir }}/{{ item.upstream }}/hosts.toml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ k8s_common_registry_mirrors }}"
  loop_control:
    label: "{{ item.upstream }}"
  # No handler notification on purpose: containerd re-reads certs.d on every
  # pull and does not need restarting for these. Only config.toml changes do,
  # and containerd.yml owns those.

# Everything above is inert unless containerd actually loaded config_path for
# whichever component performs pulls. Assert it, because the failure mode is
# silence: pulls keep succeeding via the hosts.toml fallback, they just never
# touch the cache, and nothing anywhere reports a problem.
#
# The check is "no config_path is left empty", NOT "the registry table
# mentions the certs directory". The earlier, narrower version passed
# vacuously on the control plane: containerd 2.x ships the registry path
# already populated, so it reported success while pulls were bypassing the
# cache entirely through the transfer service, whose own config_path was
# still empty. See containerd.yml for the full explanation of which key
# matters on which major.
#
# Anchored on `config_path` exactly so plugin_config_path -- a different
# setting that merely contains the string -- is not counted.
- name: Read containerd's resolved configuration
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: containerd config dump
  register: k8s_common_containerd_config_dump
  changed_when: false

- name: Find any registry config_path containerd still has unset
  ansible.builtin.set_fact:
    k8s_common_empty_config_paths: >-
      {{ k8s_common_containerd_config_dump.stdout_lines
         | select('match', '^\s*config_path\s*=\s*(''|"")\s*$')
         | list }}

- name: Assert containerd is reading the registry configuration directory
  ansible.builtin.assert:
    that:
      - k8s_common_registry_certs_dir in k8s_common_containerd_config_dump.stdout
      - k8s_common_empty_config_paths | length == 0
      # Version-agnostic: the key is absent on containerd 1.7, so this passes
      # there, and on 2.x it only passes once the pull path honours mirrors.
      - "'use_local_image_pull = false' not in k8s_common_containerd_config_dump.stdout"
    fail_msg: >-
      containerd on {{ inventory_hostname }} is not fully pointed at
      {{ k8s_common_registry_certs_dir }}, so at least one component will
      ignore the hosts.toml files just written and pull straight from the
      upstream registry.
      {% if k8s_common_empty_config_paths | length > 0 %}
      {{ k8s_common_empty_config_paths | length }} config_path key(s) are
      still empty: {{ k8s_common_empty_config_paths | join(' | ') }}.
      On containerd 2.x the one that matters for pulls belongs to
      [plugins.'io.containerd.transfer.v1.local'], NOT to the registry table,
      because use_local_image_pull defaults to false and delegates pulls to
      the transfer service.
      {% else %}
      No empty keys remain, but the certs directory does not appear at all --
      the `Point containerd at the registry configuration directory` task in
      containerd.yml did not match this node's config.toml. Compare the
      quoting: containerd 1.7 emits "" and 2.x emits ''.
      {% endif %}
      Inspect with `sudo containerd config dump | grep -n config_path`.
    success_msg: >-
      containerd is reading {{ k8s_common_registry_certs_dir }} with no
      config_path left unset
      ({{ k8s_common_registry_mirrors | length }} mirrors configured)
