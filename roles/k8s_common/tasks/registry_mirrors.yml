---
# Point containerd at the in-cluster pull-through caches (homelab-infra,
# apps/registry-cache). Runs after containerd.yml, which is what sets
# `config_path` in config.toml to the directory these files land in -- without
# that line containerd never reads this directory at all.

- name: Create the containerd registry configuration directory
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.file:
    path: "{{ k8s_common_registry_certs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create a directory per mirrored registry
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.file:
    path: "{{ k8s_common_registry_certs_dir }}/{{ item.upstream }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ k8s_common_registry_mirrors }}"
  loop_control:
    label: "{{ item.upstream }}"

- name: Write the hosts.toml for each mirrored registry
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: "{{ k8s_common_registry_certs_dir }}/{{ item.upstream }}/hosts.toml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ k8s_common_registry_mirrors }}"
  loop_control:
    label: "{{ item.upstream }}"
  # No handler notification on purpose: containerd re-reads certs.d on every
  # pull and does not need restarting for these. Only config.toml changes do,
  # and containerd.yml owns those.

# Everything above is inert unless containerd actually loaded config_path for
# the REGISTRY plugin. Assert it, because the failure is silent: pulls keep
# succeeding, they just never touch the cache, and nobody notices for months.
#
# This deliberately re-reads and scopes to the registry table rather than
# grepping the whole `containerd config dump` for the certs directory. A
# whole-file substring check passes vacuously on containerd 2.x, where
# Ubuntu's default already puts /etc/containerd/certs.d on an unrelated line
# -- so the check would have reported success on the control plane no matter
# what the role did, which is worse than having no check at all.
- name: Re-read containerd's effective registry config_path
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      containerd config dump | awk '/\.registry\]$/ {f=1} f && /config_path/ {print; exit}'
    executable: /bin/bash
  register: k8s_common_containerd_registry_config_path_final
  changed_when: false

- name: Assert containerd is reading the registry configuration directory
  ansible.builtin.assert:
    that:
      - k8s_common_registry_certs_dir in k8s_common_containerd_registry_config_path_final.stdout
    fail_msg: >-
      containerd on {{ inventory_hostname }} is not reading
      {{ k8s_common_registry_certs_dir }} for the registry plugin, so the
      hosts.toml files just written are ignored and every pull still goes
      straight to the upstream registry.
      The registry table resolved to:
      "{{ k8s_common_containerd_registry_config_path_final.stdout | default('<no config_path found under any .registry] table>') }}".
      In the order worth checking:
      (1) the value is empty -- the `Point containerd at the registry
      configuration directory` task in containerd.yml did not match this
      node's config.toml. Compare the quoting (containerd 1.7 emits "" and 2.x
      emits '') and the enclosing table, which also differs between majors.
      (2) the value is a different, deliberately-chosen directory -- then set
      `k8s_common_registry_certs_dir` to that path (per-host or per-group)
      rather than changing the node, and this role will write the hosts.toml
      files where containerd already looks. Note the value may be a
      colon-separated LIST, which is fine as long as it contains ours.
      (3) nothing printed at all -- the awk found no `.registry]` table, which
      means the config schema moved again; inspect
      `containerd config dump` by hand.
    success_msg: >-
      containerd registry config_path is
      "{{ k8s_common_containerd_registry_config_path_final.stdout | trim }}"
      ({{ k8s_common_registry_mirrors | length }} mirrors configured)
