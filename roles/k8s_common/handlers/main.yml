---
- name: Restart containerd
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.systemd:
    name: containerd
    state: restarted

- name: Apply sysctl settings
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Update Kubernetes apt cache
  become: true
  become_method: ansible.builtin.sudo
  ansible.builtin.apt:
    update_cache: true
