---

- name: Include Raspberry-Pi MOTD.
  ansible.builtin.import_playbook: playbooks/raspberry-pi-motd.yml

- name: Initial machine setup
  hosts: pis

  tasks:
    - name: Setup Git
      ansible.builtin.apt:
        name: git
    - name: Setup xRDP
      block:
        - name: Install xRDP
          become: true
          become_method: ansible.builtin.sudo
          ansible.builtin.apt:
            name: xrdp
        - name: Add xRSP to SSL-Cert Group
          become: true
          become_method: ansible.builtin.sudo
          ansible.builtin.user:
            name: '{{ ansible_user_id }}'
            append: true
            groups:
              - ssl-cert
        - name: Allow users to use Colord
          become: true
          become_method: ansible.builtin.sudo
          vars:
            source_path: 45-allow-colord.pkla
          ansible.builtin.copy:
            src: "{{ source_path }}"
            dest: /etc/polkit-1/localauthority/50-local.d/
            mode: "0644"
    - name: Ensure Snapd installed.
      become: true
      ansible.builtin.apt:
        name: snapd
    - name: Check env file groups
      ansible.builtin.shell: grep -c ':/snap/bin' /etc/environment || true
      changed_when: false
      register: env_snap
    - name: Append snap
      become: true
      become_method: ansible.builtin.sudo
      ansible.builtin.lineinfile:
        path: /etc/environment
        regexp: "^(PATH=\".*)(\")$"
        line: '\1:/snap/bin\2'
        backrefs: true
      when: env_snap.stdout == "0"

- name: Include Oh-My-ZSH.
  ansible.builtin.import_playbook: playbooks/oh-my-zsh.yml

- name: Include Docker.
  ansible.builtin.import_playbook: playbooks/docker.yml

- name: Include MicroK8s.
  ansible.builtin.import_playbook: playbooks/microk8s.yml

- name: Include OpenVPN.
  ansible.builtin.import_playbook: playbooks/openvpn.yml
