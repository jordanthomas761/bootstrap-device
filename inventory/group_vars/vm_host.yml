---
# The Mac that runs the UTM control-plane VM. Consumed by
# playbooks/vm-host-lifecycle.yml -- nothing in main.yml touches it.

# The login user the agents run as. UTM is a GUI app: utmctl only works inside
# that user's logged-in session, so these are per-user LaunchAgents, not
# system LaunchDaemons.
vm_host_user: "{{ ansible_user | default(ansible_user_id) }}"
vm_host_home: "/Users/{{ vm_host_user }}"

# REQUIRED. The VM's name (or UUID) exactly as `utmctl list` prints it.
# Deliberately unset: acting on the wrong VM is worse than failing the
# preflight assertion in the playbook.
# utm_vm_name: ""

utm_app: /Applications/UTM.app
utmctl_bin: "{{ utm_app }}/Contents/MacOS/utmctl"

# How the scripts reach the control plane: as the restricted vm-ctl user with a
# dedicated key generated on this Mac by playbooks/vm-ctl-access.yml. The verbs it
# may run, and why it is not the admin login, are in inventory/group_vars/all.yml.
cluster_cp_host: "{{ hostvars['k8s-cp'].ansible_host }}"
vm_ctl_key: "{{ vm_host_home }}/.ssh/id_ed25519_vm_ctl"

# Where the scripts, plists and logs go. All under the login user's home, so
# nothing here needs root.
vm_lifecycle_bin_dir: "{{ vm_host_home }}/.local/bin"
vm_lifecycle_log_dir: "{{ vm_host_home }}/Library/Logs/cluster-vm"
vm_lifecycle_agents_dir: "{{ vm_host_home }}/Library/LaunchAgents"
vm_lifecycle_label_prefix: local.homelab.cluster-vm

# Seconds. Shutdown: the snapshot (~10s) plus the guest powering off. Startup:
# VM boot plus kubeadm's static pods coming back, which is slow on a small VM.
vm_shutdown_timeout: 180
vm_startup_timeout: 600

# How long launchd lets the shutdown hook run after SIGTERM before SIGKILL.
# macOS may still cut a real system shutdown shorter than this; see the README.
vm_hook_exit_timeout: 240

# ---------------------------------------------------------------------------
# Headless QEMU runner (playbooks/vm-runner.yml). Replaces running the VM in UTM:
# a boot-time LaunchDaemon supervises QEMU as an unprivileged service user, so
# the VM starts with nobody logged in. See "Headless control-plane VM" in the
# README, including the manual cutover steps.
# ---------------------------------------------------------------------------

# Unprivileged, hidden, no login shell. macOS role accounts live below UID 500;
# 399 must simply be free (`dscl . -list /Users UniqueID | sort -k2 -n`).
vm_runner_user: _vmrunner
vm_runner_uid: 399
vm_runner_group: staff
vm_runner_home: /var/vm
# Disk, EFI variables, firmware copy, QMP socket, serial log and the runner's
# own ssh key all live here. 0750, owned by the runner.
vm_runner_dir: /var/vm/controlplane
# Root-owned, so the service user cannot rewrite the script launchd runs.
vm_runner_bin_dir: /opt/vm-runner/bin
vm_runner_label: local.homelab.vm-runner
# false: install everything but do not start it. The cutover sets this to true
# once the VM files are in place and the old VM is stopped.
vm_runner_load: false

vm_qemu_bin: /opt/homebrew/bin/qemu-system-aarch64
vm_socket_vmnet_client: /opt/socket_vmnet/bin/socket_vmnet_client
vm_socket_vmnet_socket: /var/run/socket_vmnet.bridged.en0

# The VM's identity, copied from the UTM VM it replaces (`ps` on the running UTM
# QEMU, or its config.plist). Keep them identical: the MAC fixes the DHCP lease,
# and netplan binds the NIC by name (enp0s1), so the NIC must stay the first PCI
# device. The machine type is pinned to what UTM's QEMU used (`virt-10.0`, read
# from /sys/class/dmi/id/product_version in the guest) so the hardware layout,
# and therefore the NIC name, does not move when Homebrew's QEMU upgrades.
vm_name: controlplane
vm_uuid: BD16EC84-0059-4B6B-8DA3-80EAA355C4E2
vm_mac: "02:D1:F1:40:83:30"
vm_disk_serial: 79907F457E1249D48CDD
vm_machine: virt-10.0
vm_cpus: 4
vm_memory_mb: 8192

# Seconds. The guest takes ~90 s to stop on its own because kube-apiserver does
# not exit on SIGTERM promptly; launchd must allow for that plus the snapshot.
vm_runner_stop_timeout: 240
vm_runner_exit_timeout: 300
# How long to wait for the API after boot before giving up on the auto-uncordon.
vm_runner_boot_timeout: 600
